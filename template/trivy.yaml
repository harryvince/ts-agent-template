# Default config for every `trivy fs` / `trivy config` / `trivy image` run (mise tasks + hooks).
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  skip-dirs:
    - node_modules
    - .cloudflare
    # mise's lockfiles for the dev toolchain (e.g. Semgrep's own Python deps), not app dependencies.
    - .mise
pkg:
  include-dev-deps: true
