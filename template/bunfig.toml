[install]
# Pin exact versions on `bun add`.
exact = true
# Supply-chain guard: don't install package versions published in the last 7 days (Semgrep's bun rule requires >= 7).
minimumReleaseAge = 604800
# landmines 0.1.x adds the no-comments `allow` option that lets anti-slop's SAFETY comments through.
# Remove this exclusion once 0.1.1 is older than 7 days (after 2026-11-26).
minimumReleaseAgeExcludes = ["@interfere/landmines"]
